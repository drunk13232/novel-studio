name: Bug report / 错误报告
description: Report a reproducible issue with a minimal fictional example.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not paste private novel content, API keys, credentials, config.toml/auth.json or unsanitized logs.
        不要粘贴私人小说内容、密钥、登录配置或未脱敏日志。Security issues: see SECURITY.md; do not disclose secrets publicly.
  - type: input
    id: version
    attributes:
      label: Novel Studio version / 版本
      placeholder: 2.22.2 Preview
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version, scaling and installation type
      description: No username, personal path or machine identifier is needed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Use synthetic text and a demo project. Include the smallest steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized errors
      description: Remove private text, names, paths and tokens before adding logs/screenshots. Do not upload a whole user database or backup.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私检查
      options:
        - label: I removed private novel content, keys, credentials and unsanitized logs.
          required: true
